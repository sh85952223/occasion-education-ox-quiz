<style>
  /* 상단은 그림 없이 텍스트와 배지에 집중하도록 정리합니다. */
  .hero {
    grid-template-columns: 1fr;
    min-height: 0;
    text-align: center;
    padding-block: clamp(34px, 6vw, 68px);
  }

  .hero > div:first-child {
    width: min(860px, 100%);
    margin: 0 auto;
  }

  .hero h1,
  .hero p {
    margin-left: auto;
    margin-right: auto;
  }

  .hero-badges {
    justify-content: center;
  }

  .whale-wrap {
    display: none !important;
  }

  .answer-btn:disabled {
    cursor: default;
    opacity: 1;
  }

  .answer-btn.feedback-correct {
    border-color: #4fae96;
    background: linear-gradient(145deg, #effcf8, #ffffff);
    box-shadow: 0 0 0 5px rgba(79, 174, 150, .13), 0 16px 28px rgba(40, 124, 104, .14);
  }

  .answer-btn.feedback-wrong {
    border-color: #dc7da8;
    background: linear-gradient(145deg, #fff0f6, #ffffff);
    box-shadow: 0 0 0 5px rgba(220, 125, 168, .12), 0 16px 28px rgba(165, 72, 116, .13);
  }

  .answer-feedback {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 15px;
    align-items: start;
    margin-top: 18px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: rgba(255, 255, 255, .88);
    box-shadow: 0 12px 28px rgba(80, 65, 140, .1);
    animation: feedbackReveal .24s ease-out;
  }

  .answer-feedback[hidden] {
    display: none !important;
  }

  .answer-feedback.correct {
    border-color: rgba(79, 174, 150, .34);
    background: linear-gradient(145deg, rgba(223, 247, 241, .94), rgba(255, 255, 255, .96));
  }

  .answer-feedback.wrong {
    border-color: rgba(220, 125, 168, .34);
    background: linear-gradient(145deg, rgba(255, 227, 239, .92), rgba(255, 255, 255, .96));
  }

  .answer-feedback.loading {
    border-style: dashed;
    background: linear-gradient(145deg, rgba(238, 232, 255, .72), rgba(255, 255, 255, .94));
  }

  @keyframes feedbackReveal {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .feedback-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: 50%;
    font-family: "Jua", sans-serif;
    font-size: 24px;
    background: var(--purple-pale);
    color: var(--purple-deep);
  }

  .answer-feedback.correct .feedback-icon {
    color: #287c68;
    background: #dff7f1;
  }

  .answer-feedback.wrong .feedback-icon {
    color: #a54874;
    background: #ffe3ef;
  }

  .feedback-content {
    min-width: 0;
  }

  .feedback-title {
    display: block;
    margin: 1px 0 5px;
    color: var(--ink);
    font-family: "Jua", "Noto Sans KR", sans-serif;
    font-size: 23px;
    font-weight: 400;
    line-height: 1.25;
  }

  .feedback-answer {
    margin: 0 0 8px;
    color: var(--purple-deep);
    font-size: 13px;
    font-weight: 900;
  }

  .feedback-explanation {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.72;
  }

  .feedback-source {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 8px 11px;
    border-radius: 11px;
    color: var(--purple-deep);
    background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line);
    font-size: 11px;
    font-weight: 900;
    text-decoration: none;
  }

  .feedback-source:hover {
    transform: translateY(-1px);
    box-shadow: 0 7px 16px rgba(80, 65, 140, .1);
  }

  .feedback-wait {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(102, 80, 170, .16);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }

  @media (max-width: 620px) {
    .hero {
      text-align: left;
    }

    .hero h1,
    .hero p {
      margin-left: 0;
      margin-right: 0;
    }

    .hero-badges {
      justify-content: flex-start;
    }

    .answer-feedback {
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 11px;
      padding: 17px 15px;
      border-radius: 18px;
    }

    .feedback-icon {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .feedback-title {
      font-size: 20px;
    }
  }
</style>
