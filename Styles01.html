<style>
:root {
      --ink: #352d55;
      --ink-soft: #6f648f;
      --purple: #8f79ca;
      --purple-deep: #6650aa;
      --purple-pale: #eee8ff;
      --blue: #85bdf4;
      --blue-pale: #e7f5ff;
      --pink: #f6b8d5;
      --pink-pale: #fff0f7;
      --mint: #9ddfd1;
      --yellow: #ffe59a;
      --white: rgba(255, 255, 255, .92);
      --line: rgba(102, 80, 170, .16);
      --shadow: 0 22px 60px rgba(80, 65, 140, .17);
      --shadow-soft: 0 12px 30px rgba(80, 65, 140, .12);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 8%, rgba(255,255,255,.95) 0 2%, transparent 18%),
        radial-gradient(circle at 92% 12%, rgba(255,240,247,.9) 0 4%, transparent 24%),
        linear-gradient(155deg, #e9e8ff 0%, #dff3ff 42%, #f8edff 74%, #fff4f9 100%);
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; }

    .skip-link {
      position: fixed;
      left: 16px;
      top: -100px;
      z-index: 999;
      padding: 10px 14px;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-soft);
    }

    .skip-link:focus { top: 16px; }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-repeat: repeat;
      z-index: -1;
    }

    .stars {
      opacity: .62;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.98) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,231,153,.9) 0 1.2px, transparent 2px);
      background-size: 80px 80px, 125px 125px;
      background-position: 0 0, 28px 18px;
      animation: drift 18s linear infinite;
    }

    .stars::before {
      background-image:
        radial-gradient(circle, rgba(150,128,215,.35) 0 1.2px, transparent 2px);
      background-size: 110px 110px;
      background-position: 35px 40px;
    }

    @keyframes drift {
      to { transform: translate3d(0, 36px, 0); }
    }

    .app-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 60px;
    }

    .hero {
      position: relative;
      min-height: 240px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      align-items: center;
      gap: 24px;
      padding: clamp(26px, 5vw, 58px);
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 40px;
      background:
        linear-gradient(120deg, rgba(255,255,255,.82), rgba(239,232,255,.72)),
        radial-gradient(circle at 78% 20%, rgba(133,189,244,.28), transparent 40%);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(1px);
      z-index: -1;
    }

    .hero::before {
      width: 420px;
      height: 420px;
      right: -180px;
      top: -220px;
      background: rgba(146,196,255,.34);
    }

    .hero::after {
      width: 340px;
      height: 340px;
      left: -220px;
      bottom: -240px;
      background: rgba(247,184,216,.28);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 13px;
      color: var(--purple-deep);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.02em;
      border: 1px solid rgba(102,80,170,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
    }

    .hero h1 {
      margin: 0;
      max-width: 760px;
      font-family: "Jua", "Noto Sans KR", sans-serif;
      font-size: clamp(35px, 5.2vw, 66px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -.04em;
      color: var(--purple-deep);
      text-wrap: balance;
    }

    .hero p {
      max-width: 650px;
      margin: 17px 0 0;
      color: var(--ink-soft);
      font-size: clamp(15px, 1.8vw, 19px);
      font-weight: 600;
      line-height: 1.65;
      text-wrap: balance;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .hero-badges span {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(102,80,170,.12);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .whale-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 170px;
    }

    .whale {
      width: min(330px, 100%);
      filter: drop-shadow(0 18px 18px rgba(82,86,160,.18));
      animation: whaleFloat 4.8s ease-in-out infinite;
    }

    @keyframes whaleFloat {
      50% { transform: translateY(-10px) rotate(-1deg); }
    }

    .bubble {
      position: absolute;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.85);
      background: rgba(171,218,255,.2);
      animation: bubble 5s ease-in-out infinite;
    }

    .bubble.b1 { width: 24px; height: 24px; top: 12px; right: 22%; }
    .bubble.b2 { width: 12px; height: 12px; top: 48px; right: 16%; animation-delay: -1.8s; }
    .bubble.b3 { width: 18px; height: 18px; bottom: 24px; left: 8%; animation-delay: -3s; }

    @keyframes bubble {
      50% { transform: translateY(-13px) scale(1.06); opacity: .7; }
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 22px;
      margin-top: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(255,255,255,.84);
      border-radius: var(--radius-xl);
      background: var(--white);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }

    .main-panel {
      min-height: 620px;
      padding: clamp(20px, 4vw, 42px);
    }

    .side-panel {
      position: sticky;
      top: 16px;
      padding: 22px;
    }

    .view[hidden] { display: none !important; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--purple-deep);
      font-size: 13px;
      font-weight: 900;
    }

    .section-title {
      margin: 0;
      color: var(--ink);
      font-family: "Jua", "Noto Sans KR", sans-serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: -.03em;
      line-height: 1.15;
    }

    .section-desc {
      margin: 12px 0 0;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
    }

    .nickname-form {
      display: grid;
      gap: 14px;
      margin-top: 28px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(238,232,255,.62), rgba(231,245,255,.68));
    }

    .nickname-form label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    .nickname-form input {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 2px solid transparent;
      border-radius: 16px;
      outline: none;
      background: rgba(255,255,255,.96);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(102,80,170,.12);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .nickname-form input:focus {
      border-color: rgba(102,80,170,.52);
      box-shadow: 0 0 0 4px rgba(143,121,202,.12);
    }

    .primary-btn,
    .ghost-btn,
    .next-btn {
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .primary-btn {
      min-width: 150px;
      min-height: 54px;
      padding: 0 22px;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--purple-deep));
      box-shadow: 0 12px 24px rgba(102,80,170,.25);
    }

    .primary-btn:hover,
    .next-btn:hover,
    .ghost-btn:hover { transform: translateY(-2px); }
</style>
